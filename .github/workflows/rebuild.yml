name: Build & deploy site

# Regenerates the static pages from Supabase and deploys them to GitHub Pages
# as a Pages artifact — the server-side equivalent of the admin's local
# "Rebuild site" button, so you can refresh the live site from anywhere.
#
# The generated pages are NOT committed to the repo (see .gitignore): CI builds
# them fresh on every run and publishes the result directly, so `main` only ever
# holds source (templates, CSS, JS, data scripts).
#
# Triggers:
#   • On every push to main (rebuilds when you change code/templates/CSS)
#   • Manually — Actions tab → "Build & deploy site" → "Run workflow"
#   • Nightly at 07:00 UTC (optional — delete the `schedule:` block to disable)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read    # read-only: nothing is committed back anymore
  pages: write      # publish a Pages deployment
  id-token: write   # required by actions/deploy-pages

# Let a running deploy finish before the next starts (don't cancel a publish).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reads from Supabase using the publishable key in js/config.js
      # (public reads only — no secrets needed).
      - name: Build pages from Supabase
        run: node build/build-dossiers.mjs

      - uses: actions/configure-pages@v5

      # Uploads the whole working tree (generated pages now exist on disk).
      # upload-pages-artifact excludes .git and .github by default.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
