<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · Archive84</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header class="bar">
    <span class="bar__brand">Archive84 · Admin</span>
    <nav class="menubar" id="menu" hidden></nav>
    <span class="bar__user" id="user-email"></span>
    <label class="switch" id="rebuild-all-wrap" hidden title="Force-rewrite every page, not just changed ones">
      <input type="checkbox" id="rebuild-all">
      <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
      <span class="switch__text">Rebuild all</span>
    </label>
    <button id="rebuild" hidden>Rebuild site</button>
    <button id="logout" hidden>Sign out</button>
  </header>

  <!-- LOGIN -->
  <main class="login" id="login-view" hidden>
    <form id="login-form" class="login__card">
      <h1>Sign in</h1>
      <label>Email <input type="email" id="login-email" autocomplete="username" required></label>
      <label>Password <input type="password" id="login-password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <p class="login__error" id="login-error" hidden></p>
    </form>
  </main>

  <!-- APP -->
  <main class="app" id="app-view" hidden>
    <section class="panel" id="list-panel">
      <h2 class="panel__title" id="list-title"></h2>
      <div class="panel__head">
        <input type="search" id="list-filter" placeholder="Filter…">
        <button id="bulk-upload" hidden>⇪ Bulk upload</button>
        <button id="new-record">+ New</button>
      </div>
      <table class="list" id="list"></table>
    </section>

    <!-- BULK MEDIA UPLOAD -->
    <section class="editor" id="bulk-panel" hidden>
      <div class="editor__head">
        <button type="button" id="bulk-close" class="editor__back">&larr; Back to list</button>
        <h2>Bulk upload media</h2>
      </div>
      <p class="bulk__intro">Shared credit/rights/type apply to every file. Alt text is required per
        file (see non-negotiable #1). Files upload as separate media records.</p>
      <div class="drawer__fields">
        <label>Type
          <select id="bulk-type"></select>
        </label>
        <label>Rights *
          <select id="bulk-rights"></select>
        </label>
        <label class="span-2">Credit *
          <input type="text" id="bulk-credit" placeholder="e.g. Photo © Jane Collector, used with permission">
        </label>
        <label class="span-2">Source URL
          <input type="text" id="bulk-source">
        </label>
        <label class="span-2">Choose files
          <input type="file" id="bulk-files" accept="image/*,.pdf" multiple>
        </label>
      </div>
      <div class="bulk__grid" id="bulk-grid"></div>
      <div class="drawer__actions">
        <button type="button" id="bulk-submit">Upload all</button>
        <span class="drawer__status" id="bulk-status"></span>
      </div>
    </section>

    <!-- FULL-PAGE EDITOR -->
    <section class="editor" id="drawer" hidden>
      <div class="editor__head">
        <button type="button" id="drawer-close" class="editor__back">&larr; Back to list</button>
        <div class="editor__titles">
          <span class="editor__eyebrow" id="drawer-entity"></span>
          <h2 id="drawer-title"></h2>
        </div>
        <a id="drawer-view" class="editor__view" target="_blank" rel="noopener" hidden>View page &#8599;</a>
      </div>
      <form id="record-form">
        <div class="drawer__fields" id="drawer-fields"></div>
        <div class="drawer__links" id="drawer-links"></div>
        <div class="drawer__credits" id="drawer-credits"></div>
        <div class="drawer__related" id="drawer-related"></div>
        <div class="drawer__media" id="drawer-media"></div>
        <div class="drawer__actions">
          <button type="submit" id="save">Save</button>
          <button type="button" id="delete" class="danger" hidden>Delete</button>
          <span class="drawer__status" id="form-status"></span>
        </div>
      </form>
    </section>
  </main>

  <!-- Dev admin: import with a per-load cache-buster so editing admin.js and
       reloading always runs the latest, never a browser-cached module. -->
  <script type="module">import(`./admin.js?v=${Date.now()}`);</script>
</body>
</html>
